<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRコード生成アプリ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }

    #qr-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
    }

    #qr {
      margin: 10px;
      border: 2px solid #333;
    }

    #qr-seed {
      font-size: 18px;
      margin-top: 10px;
      text-align: center;
    }
    #genbutton{
      margin: auto 0;
    }

    .qr-history {
      display: flex;
      flex-direction: column-reverse;
      margin-top: 20px;
      gap: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      width: 90%;
    }

    .qr-history div {
      cursor: pointer;
      padding: 5px;
      border: 2px solid transparent;
    }

    .qr-history div.selected {
      border-color: red;
    }

    input[type="text"] {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
      width: 80%;
      max-width: 300px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }

    button:hover {
      background-color: #45a049;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <h1>QRコード生成アプリ</h1>
  
  <div id="qr-container">
    <canvas id="qr"></canvas>
  </div>

  <div id="qr-seed"></div>

  
  <div>
    <input type="text" id="input-text" placeholder="QRコードのシードを入力" />
    <button id="genbutton" onclick="generateQRCode()">QRコードを生成</button>
  </div>
 



  <p>または、スペースキーを押してQRコードを生成</p>

  

  <div class="qr-history" id="qr-history">
    <!-- 生成したQRコード履歴がここに追加されます -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script>
    const qrHistory = [];
    const maxHistory = 10;

    const qrContainer = document.getElementById('qr-container');
    const qrCanvas = document.getElementById('qr');
    const qrSeedElement = document.getElementById('qr-seed');


    const qrHistoryContainer = document.getElementById('qr-history');
    const inputText = document.getElementById('input-text');
    

    let lastGeneratedQR = null;

    // QRコードを生成する関数
    function generateQRCode() {
      const seed = inputText.value.trim() || generateRandomSeed();
      createQRCode(seed);
      inputText.value = ''; // テキストボックスを空にする
    }

    // より高いランダム性を持つシードを生成
    function generateRandomSeed() {
  const length = 126;
  const charset = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let result = '';
  const array = new Uint8Array(length);
  window.crypto.getRandomValues(array);
  for (let i = 0; i < length; i++) {
    result += charset[array[i] % charset.length];
  }
  return result;
}

    // QRコードを作成し、履歴に追加
    function createQRCode(seed) {
      QRCode.toCanvas(qrCanvas, seed, {
        width: 450, // 最新QRコードは500pxに設定
      }, function(error) {
        if (error) {
          console.error(error);
        } else {
          // 最新QRコードは履歴に追加せず、シードを表示
          displaySeed(seed);
          addToHistory(seed); // 履歴に追加
        }
      });
    }

    // 最新のQRコードのシードを中央に表示
    function displaySeed(seed) {
      // 中央のQRコードの下にシードを表示
      qrSeedElement.textContent = `シード: ${seed}`;
      lastGeneratedQR = seed; // 最新のQRコードを記録
    }

    // 履歴にQRコードを追加する関数
    function addToHistory(seed) {
      if (qrHistory.length >= maxHistory) {
        qrHistory.shift(); // 古いQRコードを削除
      }

      qrHistory.push(seed);

      // 履歴を表示
      updateHistory();
    }

    // 履歴を更新する関数
    function updateHistory() {
      qrHistoryContainer.innerHTML = ''; // 履歴リストをクリア

      qrHistory.forEach((seed, index) => {
        const historyItem = document.createElement('div');
        historyItem.textContent = seed;
        historyItem.onclick = () => displayQRFromHistory(index);

        // 直前のQRコードにアウトラインを追加
        if (index === qrHistory.length - 2) {
          historyItem.classList.add('selected');
        }

        qrHistoryContainer.appendChild(historyItem);
      });
    }

    // 履歴からQRコードを表示する関数
    function displayQRFromHistory(index) {
      const seed = qrHistory[index];
      QRCode.toCanvas(qrCanvas, seed, {
        width: 300, // 履歴のQRコードは300pxに設定
      }, function(error) {
        if (error) {
          console.error(error);
        }
      });
    }

    // スペースキーでQRコードを生成
    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space') {
        event.preventDefault();
        generateQRCode();
      }
    });

    // モバイル向けのQRコード生成ボタン
    document.querySelector('button').addEventListener('click', () => {
      generateQRCode();
    });
  </script>

</body>
</html>
