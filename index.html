<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>QRコード自動生成</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 50px;
      background: #f5f5f5;
    }
    #qrcode {
      margin: 20px auto;
      width: fit-content;
      padding: 20px;
      background: white;
      border: 1px solid #ccc;
    }
    #text {
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>QRコード自動生成</h1>
  <p>スペースキーで新しいQRコードを生成します</p>
  <div id="qrcode"></div>
  <div id="text"></div>

  <!-- QRCode.jsライブラリ読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const qrcodeContainer = document.getElementById('qrcode');
    const textContainer = document.getElementById('text');
    let qr;

    function generateRandomString(length = 10) {
      const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      return Array.from({ length }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    }

    function generateQRCode() {
      const data = generateRandomString(12); // 適当なデータ
      qrcodeContainer.innerHTML = ''; // 以前のQRを削除
      qr = new QRCode(qrcodeContainer, {
        text: data,
        width: 200,
        height: 200,
      });
      textContainer.textContent = `生成データ: ${data}`;
    }

    // 初期生成
    generateQRCode();

    // スペースキーで生成
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault(); // スクロール抑止
        generateQRCode();
      }
    });
  </script>
</body>
</html>
